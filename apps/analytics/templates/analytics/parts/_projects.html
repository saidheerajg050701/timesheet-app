{% load timesheet_tags %}
<div class="card h-100 shadow-sm" id="by-project">
  <div class="card-body">
    <h2 class="h6 text-body-secondary">Hours by project</h2>
    {% if dash.projects %}
      <div style="height: 220px"><canvas id="projects-chart" role="img" aria-label="Bar chart of hours per project; the same numbers are in the table below"></canvas></div>
      <table class="table table-sm small mb-0 mt-2" id="projects-table">
        <tbody>
          {% for code, name, minutes in dash.projects %}
            <tr><th scope="row" class="fw-normal">{{ code }} {{ name }}</th><td class="text-end">{{ minutes|hours2 }}</td></tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p class="text-body-secondary mb-0">No project work in this range.</p>
    {% endif %}
  </div>
</div>
