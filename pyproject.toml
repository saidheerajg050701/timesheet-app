[project]
name = "timesheet-app"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "django>=5.2,<5.3",
    "django-axes>=8.3.1",
    "django-environ>=0.14.0",
    "faker>=40.43.0",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.1",
    "time-machine>=3.5.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "e2e: real-browser Playwright tests (slower; run with -m e2e)",
]

[tool.coverage.run]
source = ["config", "apps"]
omit = [
    "*/migrations/*",
    "config/asgi.py",
    "config/wsgi.py",
    "config/settings/local.py",  # entry points: tests use config/settings/test.py (D-173)
    "config/settings/production.py",  # a skeleton, not used yet
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["*/migrations/*", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
