{% extends "base.html" %}

{% block title %}Account locked — Timesheets{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="card-body">
      {% include "includes/auth_brand.html" %}
      <h1 class="h4">Account locked</h1>
      <div class="alert alert-warning mt-3" role="alert">Too many failed attempts. Try again in 15 minutes, or ask HR to reset your password.</div>
      <a class="btn btn-outline-secondary" href="{% url 'login' %}">Back to log in</a>
    </div>
  </div>
</div>
{% endblock %}
